[package]
name = "codex-micro-chroma"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Model-free local macOS Now Playing artwork lighting for Codex Micro"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[target.'cfg(target_os = "macos")'.dependencies]
crossbeam-channel = "0.5"
fs2 = "0.4"
hidapi = { version = "2.6", features = ["macos-shared-device"] }
libc = "0.2"
media-remote = "0.5.2"

[build-dependencies]
cc = "1.2"

[profile.release]
strip = true
lto = "thin"
